packages:
  - "packages/*"
  - "apps/*"

# Flat, npm-style node_modules instead of pnpm's isolated store.
#
# pnpm 11 reads node_modules-layout settings ONLY from this file: `.npmrc` is now
# restricted to auth and registry keys, so the `node-linker=hoisted` that used to
# live there was silently inert. That is a placement change, not a removed feature
# -- `nodeLinker`, `shamefullyHoist` and `virtualStoreDir` are all still supported,
# in camelCase, here.
#
# Why this repo needs it: the isolated layout nests every package at
#   node_modules/.pnpm/<name>@<version>_<peerhash>/node_modules/<name>
# which costs ~80-120 characters before the package name even starts. Android's
# CMake/prefab output then lands past the 260-character limit that the SDK's
# bundled ninja hard-codes. The flat layout deletes that prefix: the worst
# measured path drops from 265 to 185 characters.
# See docs/dev-environment.md, section 3.
nodeLinker: hoisted

# pnpm 11 renamed `onlyBuiltDependencies` to this map form. With the old key the
# setting is silently ignored, and a fresh install then exits 1 with
# [ERR_PNPM_IGNORED_BUILDS] -- which is what failed the EAS build (the install
# itself completed; only the unapproved-script gate failed).
# esbuild is pulled in by vitest and needs its install script to place its binary.
allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - '@expo/cli@57.0.28'
  - '@expo/config-plugins@57.0.10'
  - '@expo/config@57.0.10'
  - '@expo/image-utils@0.11.6'
  - '@expo/metro-config@57.0.13'
  - '@expo/metro-file-map@57.0.4'
  - '@expo/prebuild-config@57.0.17'
  - '@expo/require-utils@57.0.6'
  - '@expo/router-server@57.0.12'
  - babel-preset-expo@57.0.14
  - expo-asset@57.0.19
  - expo-constants@57.0.21
  - expo-modules-autolinking@57.0.14
  - expo-modules-core@57.0.21
  - expo@57.0.27
  - '@expo/ui@57.0.22'
  - expo-linking@57.0.12
  - expo-notifications@57.0.22
  - expo-router@57.0.25
  - expo-sqlite@57.0.4
